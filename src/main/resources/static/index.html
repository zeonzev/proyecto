<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera página</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #1e293b;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            max-width: 460px;
            width: calc(100% - 2rem);
            text-align: center;
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 2rem;
        }
        p {
            margin: 0 0 1.75rem;
            color: #64748b;
            line-height: 1.5;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .links a {
            display: block;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background: #6366f1;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .links a:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <main class="card">
        <h1>Hola mundo 👋</h1>
        <p>Esta es mi primera página con Spring Boot.</p>
        <div class="links">
            <a href="/hola">Ver endpoint /hola</a>
            <a href="/saludo">Ver saludo con Thymeleaf</a>
        </div>
    </main>

</body>
</html>
