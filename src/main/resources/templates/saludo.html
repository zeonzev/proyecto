<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saludo</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            color: #1e293b;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            max-width: 460px;
            width: calc(100% - 2rem);
            text-align: center;
        }
        h1 {
            margin: 0 0 1.5rem;
            font-size: 2rem;
        }
        form {
            display: flex;
            gap: 0.5rem;
        }
        input {
            flex: 1;
            padding: 0.7rem 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
        }
        button {
            padding: 0.7rem 1.1rem;
            border: none;
            border-radius: 10px;
            background: #10b981;
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #059669;
        }
        .back {
            display: inline-block;
            margin-top: 1.25rem;
            color: #64748b;
            text-decoration: none;
        }
        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main class="card">
        <h1>Hola <span th:text="${nombre}">Juan</span> 🎉</h1>
        <form action="/saludo" method="get">
            <input type="text" name="nombre" placeholder="Escribe un nombre" th:value="${nombre}">
            <button type="submit">Saludar</button>
        </form>
        <a class="back" href="/">← Volver al inicio</a>
    </main>

</body>
</html>
